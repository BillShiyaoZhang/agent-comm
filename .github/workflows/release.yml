name: Release agent-comm CLI

on:
  push:
    tags:
      - 'v*' # 仅在推送版本 tag (例如 v1.0.0) 时触发

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release CLI Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux amd64
          - goos: linux
            goarch: amd64
            artifact_name: agent-comm-linux-amd64
          # Windows amd64
          - goos: windows
            goarch: amd64
            artifact_name: agent-comm-windows-amd64.exe
          # macOS amd64 (Intel)
          - goos: darwin
            goarch: amd64
            artifact_name: agent-comm-darwin-amd64
          # macOS arm64 (Apple Silicon M1/M2/M3)
          - goos: darwin
            goarch: arm64
            artifact_name: agent-comm-darwin-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run Build
        working-directory: ./
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" -o build/${{ matrix.artifact_name }} ./cmd/client/main.go

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/${{ matrix.artifact_name }}

  publish:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Prepare Release Binaries
        run: |
          mkdir -p release-dist
          # 整理下载归档的文件并移动到统一发布目录
          find build-artifacts -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
