name: Release agent-comm clients

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to release (for example v0.7.0)
        required: true
        type: string
      deployment_ref:
        description: Deploy repository commit or ref whose nested SDK matches this tag
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sdk_sha: ${{ steps.release.outputs.sdk_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      deployment_ref: ${{ steps.release.outputs.deployment_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve an existing release tag to its immutable commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          DEPLOYMENT_REF: ${{ inputs.deployment_ref || 'main' }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tools/release_assets.py resolve

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sdk_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Go tests
        run: go test ./...
      - name: Runtime tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
      - name: Host-independent connector tests
        env:
          PYTHONPATH: python:connectors/hermes-platform:connectors/hermes-platform/tests
        # Native Hermes integration is tested against a real host separately;
        # these suites require no host installation and never fake its APIs.
        run: |
          python -m pip install fastapi httpx
          python -m unittest -v test_attention test_collaboration_policy test_collaboration_store test_collaboration_store_adversarial
      - name: Desktop and resume tests
        run: node --experimental-vm-modules --test connectors/hermes-platform/tests/test_attention_desktop.mjs connectors/hermes-platform/tests/test_attention_resume_desktop.mjs
      - name: Release and downloader tests
        run: python -m unittest discover -s tools -p 'test_release*.py' -v

  helper:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, name: agent-comm-helper-linux-amd64}
          - {goos: windows, goarch: amd64, name: agent-comm-helper-windows-amd64.exe}
          - {goos: darwin, goarch: amd64, name: agent-comm-helper-darwin-amd64}
          - {goos: darwin, goarch: arm64, name: agent-comm-helper-darwin-arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sdk_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build helper with source revision metadata
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          HELPER_NAME: ${{ matrix.name }}
        run: go build -buildvcs=true -ldflags='-s -w' -o "build/$HELPER_NAME" ./cmd/helper
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}
          if-no-files-found: error

  wheels:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sdk_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=68' wheel
      - name: Build runtime and connector wheels without bundling dependencies
        run: python -m pip wheel --no-deps --no-build-isolation ./python ./connectors/hermes-platform --wheel-dir build/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: build/wheels/*.whl
          if-no-files-found: error

  publish:
    needs: [resolve, test, helper, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sdk_sha }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BillShiyaoZhang/agent-collaboration-deploy
          ref: ${{ needs.resolve.outputs.deployment_ref }}
          submodules: recursive
          path: deploy
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: sdk/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate deployment tools
        run: |
          python -m pip install packaging PyYAML
          python -m unittest discover -s deploy/tools/release/tests -v
          python -m unittest discover -s deploy/tools/release/early_access/tests -v
      - name: Verify source identities and build complete installation bundles
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SDK_SHA: ${{ needs.resolve.outputs.sdk_sha }}
        run: >-
          python sdk/tools/release_assets.py assemble --sdk sdk --deployment deploy
          --artifacts artifacts --output release-dist --tag "$RELEASE_TAG"
          --sdk-sha "$SDK_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python sdk/tools/release_assets.py ensure-unpublished --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Create a new draft, verify every upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SDK_SHA: ${{ needs.resolve.outputs.sdk_sha }}
        run: >-
          python sdk/tools/release_assets.py publish --output release-dist
          --tag "$RELEASE_TAG" --sdk-sha "$SDK_SHA" --repository "$GITHUB_REPOSITORY"
          --notes "sdk/docs/releases/$RELEASE_TAG.md"
