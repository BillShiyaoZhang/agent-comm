syntax = "proto3";

package proto;

option go_package = "github.com/BillShiyaoZhang/agent-comm/proto";

import "proto/envelope.proto";

message URNRegistryRequest {
  oneof op {
    RegisterRequest register = 1;
    ResolveRequest resolve = 2;
  }
}

message RegisterRequest {
  string urn = 1;
  string peer_id = 2;
  repeated string addrs = 3;
  bytes x25519_pubkey = 4;  // X25519 public key for ECIES encryption
  bytes ed25519_pubkey = 5; // Ed25519 identity public key
  bytes signature = 6;      // Self-signature over (urn | peerID | storesUserData | timestamp)
  int64 timestamp = 7;      // Signature creation timestamp
  bool stores_user_data = 8;// Policy declaration
  repeated string relay_addrs = 9; // Relay addresses
}

message ResolveRequest {
  string urn = 1;
}

message URNRegistryResponse {
  oneof op {
    RegisterResponse register = 1;
    ResolveResponse resolve = 2;
  }
}

message RegisterResponse {
  bool ok = 1;
  string info = 2;
}

message ResolveResponse {
  bool found = 1;
  string peer_id = 2;
  repeated string addrs = 3;
  bytes x25519_pubkey = 4;  // X25519 public key for ECIES encryption
  bytes ed25519_pubkey = 5; // Target Ed25519 identity public key
  bytes signature = 6;      // Target original self-signature
  int64 timestamp = 7;      // Original registration timestamp
  bool stores_user_data = 8;// Target policy declaration
  repeated string relay_addrs = 9; // Target relay addresses
}

// EncryptedEnvelope is imported from envelope.proto and reused here
// so registry.proto definitions are self-contained for protocol definitions.